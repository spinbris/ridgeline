version: polish-v02
applies_to: wind_register.xlsx / register contract v1.4
run_order: LAST - after scaffold, after Simulation is populated
idempotent: true
palette:
  navy:   "1F4E79"
  blue:   "2E75B6"
  green:  "548235"
  grey:   "7F7F7F"
  red:    "C00000"
  orange: "C55A11"
  mute:   "808080"
  highlight: "E2EFDA"   # pale green - START HERE marker, keeps dark text readable
formats:
  money: '$#,##0;($#,##0);-'
  pct:   '0.0%;(0.0%);-'
  pct0:  '0%'
  coef:  '0.00'
  days:  '#,##0.0'
  plvl:  '"P"0'
  mm:    '#,##0.0;(#,##0.0);-'
  money0: '$#,##0'      # helper columns - display only, behind the outline
  int0:   '0'
  thou:   '#,##0'
conventions:
  never_touch: [font_color]
  rationale: >
    blue font = input, black = formula, amber fill = model write-back, thin blue border =
    model-read. Polish changes fill / width / number format only, so the TOC legend stays true.
autofit:
  defaults: {min_w: 7, max_w: 34, pad: 1.6}
  sheets:
    Risk Register:      {max_w: 33, ignore_rows: [1, 2, 3]}
    Layer1_Base:        {ignore_rows: [11, 12]}    # "$M" units note under the data
    Layer1_Correlation: {ignore_rows: [1, 2]}      # parenthetical in C1/C2
    Lists:              {ignore_rows: [1]}         # cascade note in A1
    MC_Params:          {max_w: 40}
    TOC & Instructions: {only_cols: [A]}           # B is prose - fixed width
widths:   # explicit overrides only (openpyxl char units ~ points / 7)
  TOC & Instructions: {B: 89}
  Charts: {R: 6, S: 30, T: 15, U: 3, V: 15, W: 3, X: 15, Y: 15, Z: 3,
           AA: 15, AB: 15, AC: 3, AD: 16, AE: 16, AF: 16, AG: 16}
  Build Log: {A: 4, B: 24, C: 14, D: 19, E: 17, F: 44, G: 37}

steps:   # id / step / sheet / target / action / detail / why  -> rendered to Build Log
         # op:  -> executed by the driver.  op: null = documentation-only row.
- id: 1
  step: Unprotect workbook structure
  sheet: (workbook)
  target: workbook.protection
  action: unprotect
  detail: No password
  why: REG04 locks structure; sheets cannot be added until released
  op:
    kind: unprotect_workbook
- id: 2
  step: Create Charts sheet
  sheet: Charts
  target: (sheet)
  action: add / recreate
  detail: position 1, tabColor navy, gridlines off
  why: Dashboard tab; keeps protected machine tabs untouched
  op:
    kind: create_sheet
    name: Charts
    index: 1
    tab_color: navy
    gridlines: false
- id: 3
  step: Title block
  sheet: Charts
  target: A1:A2
  action: write text
  detail: 'A1 title 14pt bold navy; A2 provenance note 9pt italic grey. A1 is a FORMULA
    on Set_ProjectName / Set_ProjectNumber, not the literal project string - the polish
    layer is shared across projects and must not carry a project identifier.

    '
  why: Reader knows the charts are generated, not hand-made
  op:
    kind: composite
    ops:
    - kind: set
      sheet: Charts
      ref: A1
      value: ="Cost-QRA Charts — "&Set_ProjectName&" ("&Set_ProjectNumber&")"
    - kind: title
      sheet: Charts
      ref: A1
      size: 14
    - kind: set
      sheet: Charts
      ref: A2
      value: All charts are driven by live ranges on Simulation / EMV & Mode Analysis.
        Re-run the model and these refresh. Generated by tools/register_polish.py
        — do not hand-edit.
    - kind: note
      sheet: Charts
      ref: A2
      color: mute
- id: 4
  step: Tornado helper - tie-break key
  sheet: Charts
  target: V3:V37
  action: formula
  detail: ='EMV & Mode Analysis'!B12-ROW()/1000000 (filled down)
  why: Breaks duplicate EMV values so LARGE/MATCH ranks uniquely
  op:
    kind: formula_fill_n
    anchor: V3
    count: 35
    templates:
    - ='EMV & Mode Analysis'!B{12+i}-ROW()/1000000
    formats:
    - int0
- id: 5
  step: Tornado helper - rank
  sheet: Charts
  target: R3:R17
  action: formula
  detail: R3 = 1 literal; R4:R17 = previous + 1
  why: Top-15 rank index that steps 6 and 7 LARGE() against
  op:
    kind: composite
    ops:
    - kind: set
      sheet: Charts
      ref: R3
      value: 1
    - kind: formula_fill
      sheet: Charts
      anchor: R4
      count: 14
      template: =R{3+i}+1
- id: 6
  step: Tornado helper - label
  sheet: Charts
  target: S3:S17
  action: formula
  detail: INDEX/MATCH on LARGE of the tie-break key
  why: Risk description for the ranked EMV
  op:
    kind: formula_fill
    anchor: S3
    count: 15
    template: =INDEX('Risk Register'!$C$5:$C$39,MATCH(LARGE($V$3:$V$37,$R{3+i}),$V$3:$V$37,0))
- id: 7
  step: Tornado helper - value
  sheet: Charts
  target: T3:T17
  action: formula
  detail: Untie-broken EMV for display, money format
  why: The tie-break key in V is offset by ROW()/1e6 and must never be charted
  op:
    kind: formula_fill_n
    anchor: T3
    count: 15
    templates:
    - =INDEX('EMV & Mode Analysis'!$B$12:$B$46,MATCH(LARGE($V$3:$V$37,$R{3+i}),$V$3:$V$37,0))
    formats:
    - money
- id: 8
  step: S-curve helper
  sheet: Charts
  target: X3:Y103
  action: formula
  detail: X = Simulation!E (money), Y = Simulation!D (0%)
  why: Scatter needs X (cost) LEFT of Y (prob); the source has them reversed
  op:
    kind: formula_fill_2col
    anchor: X3
    count: 101
    templates:
    - =Simulation!E{2+i}
    - =Simulation!D{2+i}
    formats:
    - money0
    - pct0
- id: 9
  step: P-curve helper
  sheet: Charts
  target: AA3:AB21
  action: formula
  detail: AA is TEXT ("P"&level); AB is the cost
  why: Numeric P-level charts as a SERIES; text forces a category axis
  op:
    kind: formula_fill_2col
    anchor: AA3
    count: 19
    templates:
    - ="P"&Simulation!A{2+i}
    - =Simulation!B{2+i}
    formats:
    - null
    - money0
- id: 10
  step: Sensitivity helper
  sheet: Charts
  target: AD3:AG21
  action: formula
  detail: AD is TEXT; AE/AF/AG = Simulation J/K/L (rho=0 / elicited / rho=1)
  why: Same category fix; keeps the three rho series contiguous
  op:
    kind: formula_fill_4col
    anchor: AD3
    count: 19
    templates:
    - ="P"&Simulation!I{2+i}
    - =Simulation!J{2+i}
    - =Simulation!K{2+i}
    - =Simulation!L{2+i}
    formats:
    - null
    - money0
    - money0
    - money0
- id: 60
  step: Helper block headings
  sheet: Charts
  target: R1:AG2
  action: write text
  detail: 'Row 1 = block captions (9pt bold), row 2 = the column headings the charts
    read as SERIES TITLES via titles_from_data. Undocumented in the original Build
    Log but load-bearing: without row 2 every series is named "Series1". Ordered here,
    out of numeric sequence, because the chart steps that follow depend on it.

    '
  why: Series names come from row 2; block captions make the collapsed outline legible
  op:
    kind: composite
    ops:
    - kind: set
      sheet: Charts
      ref: R1
      value: Tornado helper — top 15 risks by cost EMV (formula-driven)
    - kind: set
      sheet: Charts
      ref: X1
      value: S-curve helper (X = cost, Y = cumulative probability)
    - kind: set
      sheet: Charts
      ref: AA1
      value: P-curve helper (text categories)
    - kind: set
      sheet: Charts
      ref: AD1
      value: Correlation sensitivity helper (text categories)
    - kind: set
      sheet: Charts
      ref: R2
      value: Rank
    - kind: set
      sheet: Charts
      ref: S2
      value: Risk
    - kind: set
      sheet: Charts
      ref: T2
      value: Cost EMV ($)
    - kind: set
      sheet: Charts
      ref: V2
      value: Tie-break key
    - kind: set
      sheet: Charts
      ref: X2
      value: Cost ($)
    - kind: set
      sheet: Charts
      ref: Y2
      value: Cumulative probability
    - kind: set
      sheet: Charts
      ref: AA2
      value: P-level
    - kind: set
      sheet: Charts
      ref: AB2
      value: Cost ($)
    - kind: set
      sheet: Charts
      ref: AD2
      value: P-level
    - kind: set
      sheet: Charts
      ref: AE2
      value: ρ = 0 (independent)
    - kind: set
      sheet: Charts
      ref: AF2
      value: Elicited ρ
    - kind: set
      sheet: Charts
      ref: AG2
      value: ρ = 1 (fully correlated)
    - kind: bold
      sheet: Charts
      ref: R2:AG2
    - kind: note
      sheet: Charts
      ref: R1
      bold: true
      italic: false
    - kind: note
      sheet: Charts
      ref: X1
      bold: true
      italic: false
    - kind: note
      sheet: Charts
      ref: AA1
      bold: true
      italic: false
    - kind: note
      sheet: Charts
      ref: AD1
      bold: true
      italic: false
    - kind: note
      sheet: Charts
      ref: V2
      bold: true
      italic: false
      color: mute
- id: 11
  step: 'Chart: S-curve'
  sheet: Charts
  target: chart_scurve
  action: add xyScatterLinesNoMarkers
  detail: src Charts!X2:Y103; pos A4; legend off
  why: Cumulative cost distribution - primary QRA output
  op:
    kind: chart
    name: chart_scurve
    type: scatter
    anchor: A4
    size:
      h: 9
      w: 15
    title: Cost S-curve — cumulative distribution
    legend: false
    x:
      ref: Charts!X3:X103
      title: Total cost ($)
      numfmt: $#,##0,,"M"
    y:
      ref: Charts!Y2:Y103
      title: Cumulative probability
      numfmt: 0%
    series_style:
    - line: navy
      width: 28575
      marker: none
- id: 12
  step: '   ... format'
  sheet: Charts
  target: chart_scurve
  action: format
  detail: catAxis $#,##0,,"M"; valAxis 0%; line navy w2.25; axis titles
  why: Readable $M axis instead of raw dollars
  op: null
- id: 13
  step: 'Chart: P-curve'
  sheet: Charts
  target: chart_pcurve
  action: add columnClustered
  detail: src Charts!AA2:AB21; pos J4; legend off
  why: P5-P95 bar view for the deliverable
  op:
    kind: chart
    name: chart_pcurve
    type: col
    anchor: J4
    size:
      h: 9
      w: 15
    title: P-level cost outcomes (P5 – P95)
    legend: false
    data:
      ref: Charts!AB2:AB21
      titles_from_data: true
    cats:
      ref: Charts!AA3:AA21
    y:
      title: Total cost ($)
      numfmt: $#,##0,,"M"
    x:
      title: Confidence level
    series_style:
    - fill: blue
- id: 14
  step: '   ... format'
  sheet: Charts
  target: chart_pcurve
  action: format
  detail: valAxis $#,##0,,"M"; series fill blue; axis titles
  why: House blue, $M axis
  op: null
- id: 15
  step: 'Chart: correlation sensitivity'
  sheet: Charts
  target: chart_corr_sensitivity
  action: add line
  detail: src Charts!AD2:AG21; pos A23; legend bottom
  why: Elicited-rho result bracketed by rho=0 and rho=1
  op:
    kind: chart
    name: chart_corr_sensitivity
    type: line
    anchor: A23
    size:
      h: 9
      w: 15
    title: Correlation sensitivity — ρ=0 vs elicited vs ρ=1
    legend: bottom
    data:
      ref: Charts!AE2:AG21
      titles_from_data: true
    cats:
      ref: Charts!AD3:AD21
    y:
      title: Total cost ($)
      numfmt: $#,##0,,"M"
    series_style:
    - line: grey
      width: 22225
    - line: navy
      width: 34925
    - line: red
      width: 22225
- id: 16
  step: '   ... format'
  sheet: Charts
  target: chart_corr_sensitivity
  action: format
  detail: valAxis $#,##0,,"M"; s0 grey w1.75; s1 navy w2.75; s2 red
  why: Elicited case emphasised; bounds de-emphasised
  op: null
- id: 17
  step: 'Chart: tornado'
  sheet: Charts
  target: chart_tornado
  action: add barClustered
  detail: src Charts!S2:T17; pos J23; legend off
  why: Top-15 cost EMV drivers
  op:
    kind: chart
    name: chart_tornado
    type: bar
    anchor: J23
    size:
      h: 12
      w: 15
    title: Top 15 risks by cost EMV
    legend: false
    data:
      ref: Charts!T2:T17
      titles_from_data: true
    cats:
      ref: Charts!S3:S17
    x:
      title: Cost EMV ($)
      numfmt: $#,##0,"k"
    reverse_categories: true
    series_style:
    - fill: orange
- id: 18
  step: '   ... format'
  sheet: Charts
  target: chart_tornado
  action: format
  detail: valAxis $#,##0,"k"; reversed category axis; fill orange
  why: maxMin puts the largest risk at the TOP (tornado convention)
  op: null
- id: 19
  step: 'Chart: EMV split'
  sheet: Charts
  target: chart_emv_split
  action: add doughnut
  detail: src 'EMV & Mode Analysis'!A87:B89; pos A42
  why: Cost vs schedule share of Layer-1 EMV
  op:
    kind: chart
    name: chart_emv_split
    type: doughnut
    anchor: A42
    size:
      h: 9
      w: 15
    title: Layer-1 EMV split — cost vs schedule
    legend: false
    data:
      ref: '''EMV & Mode Analysis''!B87:B89'
      titles_from_data: true
    cats:
      ref: '''EMV & Mode Analysis''!A88:A89'
    data_labels:
      value: false
      percent: true
      category: true
- id: 20
  step: '   ... format'
  sheet: Charts
  target: chart_emv_split
  action: format
  detail: dataLabels value off / percent on / category on; legend off
  why: Raw dollars unreadable on a label; percent + category is enough
  op: null
- id: 21
  step: Group helper columns
  sheet: Charts
  target: R:AG
  action: group byColumns
  detail: Collapsible outline, NOT hidden
  why: Helpers stay auditable but out of the way
  op:
    kind: group_columns
    first: R
    last: AG
- id: 22
  step: Create Build Log sheet
  sheet: Build Log
  target: (sheet)
  action: add / recreate
  detail: position 2, tabColor grey. Rendered by _write_log() from this file.
  why: This tab - the spec itself
  op: null
- id: 23
  step: Protect Build Log sheet
  sheet: Build Log
  target: (sheet)
  action: protect
  detail: 'No password. Charts is deliberately LEFT UNPROTECTED. Applied by _write_log(),
    not by an op: the Build Log sheet does not exist during the step loop - it is
    created after it - so a protect_sheet op here raises KeyError on a fresh scaffold.

    '
  why: Protection kills the column-outline toggle on Charts!R:AG (EnableOutlining
    is VBA-only)
  op: null
- id: 24
  step: Re-protect workbook structure
  sheet: (workbook)
  target: workbook.protection
  action: protect
  detail: No password
  why: Restore the REG04 posture after the polish pass
  op:
    kind: protect_workbook
- id: 25
  step: Re-run Validate Contract
  sheet: Simulation
  target: Out_validation
  action: manual / CI
  detail: Confirm PASS after any structural change
  why: Structural edits can break named ranges
  op: null
- id: 26
  step: House formatting spec
  sheet: (all)
  target: (convention)
  action: define
  detail: 'Header rows bold white on navy, centred, wrapped, row height 28-34. Currency
    $#,##0;($#,##0);-. Percent 0.0%. Coefficients 0.00. Days #,##0.0. P-levels "P"0.
    Autofit then clamp. The concrete values live in formats: and palette: above.

    '
  why: One spec applied to every tab so the workbook reads as a single document
  op: null
- id: 27
  step: PRESERVE existing colour convention
  sheet: (all)
  target: (convention)
  action: do not change
  detail: Asserted by the driver's _guard(), not merely documented
  why: The TOC cell-type legend must stay true
  op:
    kind: assert_convention
- id: 28
  step: Risk Register - band headers
  sheet: Risk Register
  target: N3:S3 / T3:Y3 / Z3:AD3 / AE3
  action: format
  detail: centerContinuous, NOT merged
  why: Groups 31 columns into 4 readable bands without merging cells
  op:
    kind: band_headers
    bands:
    - ref: N3:S3
      fill: blue
    - ref: T3:Y3
      fill: green
    - ref: Z3:AD3
      fill: grey
    - ref: AE3
      fill: orange
- id: 29
  step: Risk Register - column headers
  sheet: Risk Register
  target: A4:AE4
  action: format
  detail: navy fill, white bold, centred, wrapped, row height 34
  why: Replaces the harsh saturated blue
  op:
    kind: header
    sheet: Risk Register
    ref: A4:AE4
    height: 34
- id: 30
  step: Risk Register - number formats
  sheet: Risk Register
  target: see op
  action: format
  detail: money on cost cols, 0% on probabilities, days on durations
  why: Raw dollars and probabilities were unreadable
  op:
    kind: numfmt
    map:
      money:
      - P5:R39
      - AB5:AB39
      - AD5:AD39
      pct0:
      - O5:O39
      - U5:U39
      days:
      - V5:X39
      - AC5:AC39
- id: 31
  step: Risk Register - widths
  sheet: Risk Register
  target: A:AE
  action: autofit + clamp
  detail: Handled by autofit.sheets["Risk Register"] (max_w 33, ignore_rows 1-3)
  why: Descriptions and controls were truncated
  op: null
- id: 32
  step: Simulation - headers + freeze
  sheet: Simulation
  target: A1:B1, D1:E1, G1, I1:L1, N1
  action: format
  detail: navy header fill, row height 30, freeze row 1
  why: Header row was plain and scrolled away
  op:
    kind: composite
    ops:
    - kind: header
      sheet: Simulation
      ref: A1:B1
      height: 30
    - kind: header
      sheet: Simulation
      ref: D1:E1
    - kind: header
      sheet: Simulation
      ref: G1
    - kind: header
      sheet: Simulation
      ref: I1:L1
    - kind: header
      sheet: Simulation
      ref: N1
    - kind: freeze
      sheet: Simulation
      ref: A2
- id: 33
  step: Simulation - number formats
  sheet: Simulation
  target: see op
  action: format
  detail: costs money, cum prob 0%, P-levels render as P5..P95
  why: Raw floats were unreadable
  op:
    kind: numfmt
    map:
      money:
      - B2:B20
      - E2:E102
      - J2:L20
      - H3
      pct0:
      - D2:D102
      plvl:
      - A2:A20
      - I2:I20
- id: 34
  step: Simulation - H4 units contract
  sheet: Simulation
  target: H4
  action: format
  detail: 'Applied 0.000"%". VERIFIED against the engine 2026-07-30 - no longer an
    inference. src/tier1_headless.py:185 computes p80_ci95_half_width_pct as
    (100.0 * half / ci["point"]), so the stored value is PERCENT-AS-NUMBER; it reaches
    the sheet via Out_conv_pct (src/tier1_xlwings_shell.py:191,
    dist/qra_xlwings_combined.py:234). Cross-check on the golden:
    100 * 71785.93 / 60384268.05 = 0.118882 -> stored 0.1189. If the 100.0 factor is
    ever dropped this must become 0.000% - tests/test_polish.py::test_h4_units_contract
    locks it.

    '
  why: >
    Claude-in-Excel cannot read the engine source from inside Excel and had to infer
    the units. The inference was correct, but a wrong guess here displays the figure
    100x out, so the contract is now asserted rather than documented.
  op:
    kind: numfmt
    map:
      0.000"%":
      - H4
- id: 35
  step: MC_Params
  sheet: MC_Params
  target: B1 title; C column
  action: format
  detail: capex bases + day_rate money; CG coefficients 0.00; iterations
  why: Labels were truncated; capex bases unreadable
  op:
    kind: composite
    ops:
    - kind: set
      sheet: MC_Params
      ref: B1
      value: MC_Params (legacy VBA config surface - Settings is the LIVE one)
    - kind: title
      sheet: MC_Params
      ref: B1
    - kind: numfmt
      sheet: MC_Params
      map:
        money:
        - C6
        - C15
        - C21
        - C23
        - C25
        - C27
        - C29
        - C31
        coef:
        - C20
        - C22
        - C24
        - C26
        - C28
        - C30
        '#,##0':
        - C2:C3
        plvl:
        - C5
- id: 36
  step: Layer1_Base
  sheet: Layer1_Base
  target: A1:I1 header; B2:I9 values
  action: format
  detail: values are $M so 1 decimal, not currency
  why: Declared totals read in millions
  op:
    kind: composite
    ops:
    - kind: header
      sheet: Layer1_Base
      ref: A1:I1
      height: 28
    - kind: numfmt
      sheet: Layer1_Base
      map:
        mm:
        - B2:I9
        days:
        - B11
- id: 37
  step: Layer1_Factors
  sheet: Layer1_Factors
  target: A1:F1 header; C2:E15 percentages
  action: format
  detail: P10/ML/P90 are fractional deltas - percent is the correct read
  why: -0.5 renders as (50.0%)
  op:
    kind: composite
    ops:
    - kind: header
      sheet: Layer1_Factors
      ref: A1:F1
      height: 28
    - kind: numfmt
      sheet: Layer1_Factors
      map:
        pct:
        - C2:E15
- id: 38
  step: Layer1_Allocation
  sheet: Layer1_Allocation
  target: A1:I1 header; B2:I15 centred
  action: format
  detail: header row height 34
  why: x-marks centre under their factor column
  op:
    kind: composite
    ops:
    - kind: header
      sheet: Layer1_Allocation
      ref: A1:I1
      height: 34
    - kind: align
      sheet: Layer1_Allocation
      ref: B2:I15
      horizontal: center
- id: 39
  step: Layer1_Correlation
  sheet: Layer1_Correlation
  target: A4:H4 header; B5:H11 matrix
  action: format
  detail: Existing colour-scale conditional format LEFT INTACT - do NOT re-apply
  why: The scaffold already sets the colour scale
  op:
    kind: composite
    ops:
    - kind: bold
      sheet: Layer1_Correlation
      ref: A1:A2
    - kind: header
      sheet: Layer1_Correlation
      ref: A4:H4
      height: 28
    - kind: numfmt
      sheet: Layer1_Correlation
      map:
        coef:
        - B5:H11
    - kind: align
      sheet: Layer1_Correlation
      ref: B5:H11
      horizontal: center
- id: 40
  step: EMV & Mode Analysis
  sheet: EMV & Mode Analysis
  target: A1 title; three table headers; money columns
  action: format
  detail: B7 bold as the Layer-1 total
  why: Three stacked tables now visually separated
  op:
    kind: composite
    ops:
    - kind: title
