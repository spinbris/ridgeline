- id: 44
  step: Autofit caveat for the module
  sheet: (all)
  target: (implementation note)
  action: note
  detail: 'openpyxl has NO autofit. Widths are set explicitly via ws.column_dimensions[L].width
    (Excel char units, approx points / 7). Do not try to reproduce autofitColumns.

    '
  why: The single biggest gotcha when porting this to the repo
  op: null
- id: 45
  step: Unprotect / re-protect per sheet
  sheet: (all machine tabs)
  target: sheet.protection
  action: unprotect -> format -> protect
  detail: 'openpyxl sets protection at write time, so this is a no-op here. It is
    mandatory in the Office.js path, where every formatting step needs REG04 released
    first.

    '
  why: Records the sequence the Excel-side path must follow
  op: null
- id: 46
  step: Migrate spec to YAML
  sheet: Build Log
  target: config/polish_spec.yaml
  action: refactor
  detail: 'Steps 1-45 moved into this file. tools/register_polish.py reads it, EXECUTES
    the op: payload and RENDERS the human columns to the Build Log tab. One record,
    two consumers.

    '
  why: Removes drift - the Lists header-row error existed because the tab was hand-maintained
  op: null
- id: 47
  step: Autofit emulator
  sheet: (all)
  target: autofit() in tools/register_polish.py
  action: implement
  detail: 'openpyxl cannot measure rendered text, so autofit() approximates from character
    count and clamps to min_w/max_w. ignore_rows excludes note rows that sit inside
    a data column - without it Layer1_Base!B12, Lists!A1 and Layer1_Correlation!C1
    each stretch their column to the width of a sentence. Proportional fonts mean
    the estimate runs ~10% out; prose columns stay in widths: instead.

    '
  why: Removes the hand-maintained width table for everything except prose
  op:
    kind: autofit_all
