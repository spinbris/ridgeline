- id: 61
  step: TOC tab inventory + cell-type legend
  defer: 2            # after step 56 - the inventory must list tabs in their final order
  sheet: TOC & Instructions
  target: the "Tabs, in the order you fill them (auto-generated from the sheet inventory)" block
  action: add / recreate
  detail: >
    IMPLEMENTED 2026-07-30. Rebuilds the inventory from the ACTUAL sheet list and
    restores the cell-type legend beneath it. Fixes real data loss: when the generated
    tabs were added to the inventory by hand the rows were OVERWRITTEN rather than
    inserted, destroying "Cell-type legend" and the "input" and "calc" entries - so the
    legend that rule 2 depends on no longer explained blue or black font. That edit is
    the only change in this workbook's history with no Build Log entry, which is exactly
    why it went unnoticed. Existing descriptions are preserved; descriptions: only
    supplies text for tabs that have none. Rows are inserted or deleted to fit, so
    Set_ProjectName..Set_IssueDate move - the op re-points every TOC-scoped defined name
    and refuses to complete unless each still resolves to its original value.
  why: >
    The TOC is the reader's entry point and the home of the cell-type legend. Hand-editing
    it is what broke it; regenerating from the sheet list is the only fix that does not
    repeat the mistake.
  op:
    kind: toc_inventory
    sheet: TOC & Instructions
    header: Tabs, in the order you fill them (auto-generated from the sheet inventory)
    ends_before: Methodology defaults
    legend_header: Cell-type legend
    legend:
      input: Blue font, unlocked - you fill this in.
      calc: Black font, locked - a live Excel formula (do not overwrite).
      model: Amber fill - written by the model each run; do not edit.
      model-read: Thin blue border - the Python model reads this cell (may also be an input).
    overrides:
      # Build Log 58. The brief files 58 under SCAFFOLD CHANGES, on the reasoning that
      # TOC descriptions are scaffold-owned. That was true while the scaffold wrote this
      # block; step 61 now regenerates it, so a scaffold-side correction would be
      # overwritten on every build and could never hold. It has to live here or nowhere.
      MC_Params: LIVE model parameters - TIC (C6), reporting P-level (C5), cascade params (C7:C14), CG coefficients and capex bases (C20:C31). MC_day_rate = MC_Params!$C$15 is part of the range contract. NOT legacy, and NOT safe to delete - Settings is the live RUN config, this is the live MODEL config.
    descriptions:
      Charts: Chart dashboard - S-curve, P-curve, correlation sensitivity, tornado, EMV split. Generated by tools/register_polish.py.
      Build Log: Presentation-layer spec - every formatting/chart change, in order. Rendered from config/polish_spec.yaml.
      Reference (polish): The op vocabulary for raising a Polish Inbox row. Generated from the code.
      Polish Inbox: Append-only queue of PENDING presentation changes. The only place amendments are written.
      Handoff Prompt: The presentation-layer brief, rendered from docs/polish_handoff.md.
      Dashboard: PM / exec one-page summary - recommended budget at the MC_Params reporting P-level.
      Diagnostics: Analyst QC - run configuration, convergence verdict, correlation validity and spread.
