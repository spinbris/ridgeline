[pytest]
markers =
    needs_input(path): skip this test when the named repo-relative input is absent (RS-B step 3)
    project(name): run this test under a named project binding (RS-B step 2); default is conftest.DEFAULT_PROJECT
    slow: tests that run the full pipeline end-to-end (notebook + MC engines); skipped by default in CI fast lane
    unit: fast in-memory unit tests with no file I/O or engine runs (SR10.D-onwards convention)
    integration: tests that exercise multiple modules end-to-end against real fixtures; run in normal cycles (SR10.D-onwards convention; distinct from slow)
    wallclock: asserts a wall-clock budget, so it measures machine load as much as code. Deselected from every parallel lane and run serially in GATE_WALLCLOCK_LANE (TESTLANE-01 A)
    golden: GOLDEN01 golden-number regression tests (committed public tier always runs; confidential local tier guarded by QRA_GOLDEN_LOCAL). Run: pytest -m golden
